# Variables comunes de la web (app) y de las tareas automáticas (tareas).
x-entorno-asescon: &entorno-asescon
  ASESCON_DB_HOST: db
  ASESCON_DB_PORT: 3306
  ASESCON_DB_NAME: ${ASESCON_DB_NAME:-asescon}
  ASESCON_DB_USER: ${ASESCON_DB_USER:-asescon}
  ASESCON_DB_PASSWORD: ${ASESCON_DB_PASSWORD:?Define ASESCON_DB_PASSWORD in .env}
  ASESCON_DB_SUNAT_HOST: db
  ASESCON_DB_SUNAT_PORT: 3306
  ASESCON_DB_SUNAT_NAME: ${ASESCON_DB_SUNAT_NAME:-asescon_sunat}
  ASESCON_DB_SUNAT_USER: ${ASESCON_DB_USER:-asescon}
  ASESCON_DB_SUNAT_PASSWORD: ${ASESCON_DB_PASSWORD:?Define ASESCON_DB_PASSWORD in .env}
  ASESCON_FORCE_HTTPS: "1"
  # Activar tras comprobar descargas y respaldos: al descargar elimina la copia temporal.
  ASESCON_PDF_SOLO_DISPOSITIVO: ${ASESCON_PDF_SOLO_DISPOSITIVO:-0}
  ASESCON_PRECARGAR_PDF: ${ASESCON_PRECARGAR_PDF:-0}
  ASESCON_INTERVALO_BUZONES: ${ASESCON_INTERVALO_BUZONES:-10800}
  ASESCON_BUZONES_POR_RONDA: ${ASESCON_BUZONES_POR_RONDA:-3}
  ASESCON_SOL_MAX_PAGINAS: ${ASESCON_SOL_MAX_PAGINAS:-300}
  ASESCON_LIMPIEZA_SQL_DIARIA: ${ASESCON_LIMPIEZA_SQL_DIARIA:-0}
  ASESCON_URL_PUBLICA: https://sistema.asescon.net
  ASESCON_RECURSOS_PRIVADOS: /var/www/html/asescon_recursos_privados
  ASESCON_SMTP_HOST: ${ASESCON_SMTP_HOST:-}
  ASESCON_SMTP_PORT: ${ASESCON_SMTP_PORT:-}
  ASESCON_SMTP_USER: ${ASESCON_SMTP_USER:-}
  ASESCON_SMTP_PASSWORD: ${ASESCON_SMTP_PASSWORD:-}
  ASESCON_SMTP_SEGURIDAD: ${ASESCON_SMTP_SEGURIDAD:-}
  TZ: America/Lima
  ASESCON_REDIS_HOST: redis
  ASESCON_REDIS_PORT: 6379

services:
  app:
    build:
      context: .
      args:
        ASESCON_REVISION: ${ASESCON_REVISION:-desarrollo}
    image: asescon-sistema:local
    restart: unless-stopped
    # Puerto de respaldo limitado al servidor. El acceso público usa el proxy compartido.
    ports:
      - "127.0.0.1:${ASESCON_HTTP_PORT:-8080}:80"
    networks:
      default: {}
      # Red del proxy compartido con FACT-KARD (deploy/docker/proxy del repositorio fact-kard).
      redis_net: {}
      proxy_net:
        aliases: [asescon-app]
    environment: *entorno-asescon
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - asescon_private_data:/var/www/html/asescon_datos_privados
      - asescon_secure_data:/var/www/html/asescon_secure
      - asescon_recursos_privados:/var/www/html/asescon_recursos_privados:ro
    mem_limit: 768m

  # Tareas automáticas (antes "Trabajos de Cron" de cPanel): Buzón SOL, sincronización nocturna
  # (SUNAT, SIRE y SUNAFIL) y limpieza, cada 5 minutos. Misma imagen y mismos datos que la web.
  tareas:
    build:
      context: .
      args:
        ASESCON_REVISION: ${ASESCON_REVISION:-desarrollo}
    image: asescon-sistema:local
    restart: unless-stopped
    command: ["asescon-tareas"]
    environment: *entorno-asescon
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - asescon_private_data:/var/www/html/asescon_datos_privados
      - asescon_secure_data:/var/www/html/asescon_secure
      - asescon_recursos_privados:/var/www/html/asescon_recursos_privados
    # Chromium (Playwright) necesita memoria compartida y RAM.
    shm_size: 512mb
    mem_limit: 1536m
    healthcheck:
      test: ["CMD-SHELL", "test -s /var/run/crond.pid && kill -0 $$(cat /var/run/crond.pid)"]
      interval: 60s
      timeout: 5s
      retries: 3

  db:
    image: mariadb:11.4
    restart: unless-stopped
    mem_limit: 1g
    environment:
      MARIADB_ROOT_PASSWORD: ${ASESCON_DB_ROOT_PASSWORD:?Define ASESCON_DB_ROOT_PASSWORD in .env}
      MARIADB_DATABASE: ${ASESCON_DB_NAME:-asescon}
      MARIADB_USER: ${ASESCON_DB_USER:-asescon}
      MARIADB_PASSWORD: ${ASESCON_DB_PASSWORD:?Define ASESCON_DB_PASSWORD in .env}
      ASESCON_DB_SUNAT_NAME: ${ASESCON_DB_SUNAT_NAME:-asescon_sunat}
    volumes:
      - asescon_db_data:/var/lib/mysql
      - ./docker/db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "healthcheck.sh --connect --innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    profiles: ["prueba-workers"]
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - asescon_redis_data:/data
    networks:
      - redis_net
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  worker-sol:
    build:
      context: .
      args:
        ASESCON_REVISION: ${ASESCON_REVISION:-desarrollo}
    image: asescon-sistema:local
    restart: unless-stopped
    profiles: ["prueba-workers"]
    command:
      - python
      - -u
      - /var/www/html/asescon_sistema/procesos/workers/worker_sol.py
    user: www-data
    environment: *entorno-asescon
    networks:
      - default
      - redis_net
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    volumes:
      - asescon_private_data:/var/www/html/asescon_datos_privados
      - asescon_secure_data:/var/www/html/asescon_secure
      - asescon_recursos_privados:/var/www/html/asescon_recursos_privados
    shm_size: 512mb
    mem_limit: 768m
    cpus: 1.0
    healthcheck:
      disable: true

networks:
  proxy_net:
    external: true
    name: proxy_net
  redis_net:
    internal: true

volumes:
  asescon_db_data:
  asescon_private_data:
  asescon_secure_data:
  asescon_recursos_privados:
  asescon_redis_data:

